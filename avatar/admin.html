<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIドル 管理画面</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f6f6f8; color: #222; max-width: 880px; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      section { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
      h2 { font-size: 14px; margin: 0 0 8px; color: #555; }
      input, textarea { font: inherit; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
      textarea { width: 100%; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #888; background: #fff; cursor: pointer; }
      button.primary { background: #3558d6; color: #fff; border-color: #3558d6; }
      #stop { background: #d33; color: #fff; border-color: #d33; font-weight: 700; padding: 10px 20px; }
      #status { font-size: 13px; color: #888; }
      #log { font-family: ui-monospace, monospace; font-size: 12px; max-height: 360px; overflow: auto; white-space: pre-wrap; }
      .warn { color: #b26b00; } .error { color: #c22; }
      .hint { font-size: 12px; color: #888; margin: 8px 0 0; }
      .look { border: 1px solid #ccc; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
      .look.current { border-color: #3558d6; background: #eef2ff; }
      .look.missing { color: #aaa; }
      .look.generated::before { content: "★ "; color: #d08a00; }
      #domains { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
      #domains td { border-top: 1px solid #eee; padding: 6px 4px; vertical-align: top; }
      #domains td.why { color: #555; }
      #domains tr.testing td:first-child::after { content: " 試験中"; color: #3558d6; font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="row" style="justify-content: space-between; margin-bottom: 12px">
      <h1>AIドル 管理画面</h1>
      <span id="status">未接続</span>
      <span id="youtube" style="font-size: 13px; color: #555"></span>
      <button id="stop">すぐに止める</button>
    </div>
    <section>
      <h2>コメントを送る（AIが返事をします）</h2>
      <form id="comment" class="row">
        <input id="author" placeholder="名前" value="テスト" style="width: 120px" />
        <input id="text" placeholder="コメント" style="flex: 1; min-width: 200px" required />
        <button class="primary">送信</button>
      </form>
    </section>
    <section>
      <h2>台詞をそのまま言わせる（[joy][wave] などのタグも使えます）</h2>
      <form id="say">
        <textarea id="line" rows="2" placeholder="[joy][wave]みんな、こんばんは！"></textarea>
        <div class="row" style="margin-top: 8px"><button class="primary">喋らせる</button></div>
      </form>
    </section>
    <section>
      <h2>見た目（衣装・髪型）</h2>
      <div class="row">
        <label>シーン <select id="scene"></select></label>
        <button id="restyle">AIに選び直させる</button>
        <span id="look-now" style="color: #555"></span>
      </div>
      <div id="looks" class="row" style="margin-top: 8px"></div>
      <p class="hint">シーンを変えるとAIが見た目を選びます。配信中は「着替えて」「ポニテ見たい」などのコメントにも反応します。</p>
    </section>
    <section>
      <h2>AIの自己改善</h2>
      <div class="row">
        <span id="evo-summary">-</span>
        <button id="evo-pause">一時停止</button>
        <button id="design">新しい見た目を今すぐ作る</button>
      </div>
      <table id="domains"></table>
      <p class="hint">配信中、AIが性格・声・表情・動き・モデルを1つずつ少しだけ変えて試し、視聴者の反応が下がれば自動で元に戻します。新しい衣装・髪型も定期的に自分で作り、反応が悪いものは引退させます。記録は data/evolution/changelog.md にあります。</p>
    </section>
    <section>
      <h2>動作を試す</h2>
      <div class="row" id="gestures"></div>
    </section>
    <section>
      <h2>ログ</h2>
      <div id="log"></div>
    </section>
    <script type="module" src="/src/admin.ts"></script>
  </body>
</html>
