<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIドル 管理画面</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f6f6f8; color: #222; max-width: 880px; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      section { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
      h2 { font-size: 14px; margin: 0 0 8px; color: #555; }
      input, textarea { font: inherit; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
      textarea { width: 100%; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #888; background: #fff; cursor: pointer; }
      button.primary { background: #3558d6; color: #fff; border-color: #3558d6; }
      #stop { background: #d33; color: #fff; border-color: #d33; font-weight: 700; padding: 10px 20px; }
      #status { font-size: 13px; color: #888; }
      #log { font-family: ui-monospace, monospace; font-size: 12px; max-height: 360px; overflow: auto; white-space: pre-wrap; }
      .warn { color: #b26b00; } .error { color: #c22; }
    </style>
  </head>
  <body>
    <div class="row" style="justify-content: space-between; margin-bottom: 12px">
      <h1>AIドル 管理画面</h1>
      <span id="status">未接続</span>
      <button id="stop">すぐに止める</button>
    </div>
    <section>
      <h2>コメントを送る（AIが返事をします）</h2>
      <form id="comment" class="row">
        <input id="author" placeholder="名前" value="テスト" style="width: 120px" />
        <input id="text" placeholder="コメント" style="flex: 1; min-width: 200px" required />
        <button class="primary">送信</button>
      </form>
    </section>
    <section>
      <h2>台詞をそのまま言わせる（[joy][wave] などのタグも使えます）</h2>
      <form id="say">
        <textarea id="line" rows="2" placeholder="[joy][wave]みんな、こんばんは！"></textarea>
        <div class="row" style="margin-top: 8px"><button class="primary">喋らせる</button></div>
      </form>
    </section>
    <section>
      <h2>動作を試す</h2>
      <div class="row" id="gestures"></div>
    </section>
    <section>
      <h2>ログ</h2>
      <div id="log"></div>
    </section>
    <script type="module" src="/src/admin.ts"></script>
  </body>
</html>
